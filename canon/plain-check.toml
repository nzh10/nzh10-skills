# plain-check
# Seed rules adapted from IndenScale/slop-lint rulesets/zh.toml (MIT).
# Strict rhetoric stays in keywords/regex/tail_regex; ordinary negation uses length-adaptive density budgets.

enabled = true
max_retries = 3
negation_max_retries = 1
regex_min_sentences = 2
negation_sentence_ratio = 3
negation_max_per_sentence = 2

keywords = [
  "不代表",
  "不能把",
  "不能直接",
  "不能冒充",
  "而不是",
  "不表示",
  "，不把",
  "，避免",
  "，不等于",
  "，不保证",
  "不足以证明",
  "不完全",
  "只能说明",
  "不能确定",
  "不能当作",
  "不能承诺",
  "无法证明",
  "并不是",
  "不构成",
  "不能据此",
  "夹具",
  "探针",
]

# 每条 regex 单独按命中句数计数；满 regex_min_sentences 句触发。
regex = [
  '不是[^\n]*?(而?是|也不)',
  '是[^\n]*?不是',
  '(?:尚?未|还没|没(?:有)?)(?:提交|推送|暂存|重启|发版|改动|修改)',
  '(仍|另)(需|缺|未|待|是|显示)',
  '实测',
]

# 普通否定密度层：先遮罩 negation_allow 中的固化双音常词，再按有效句数动态预算与单句上限双重判定。
negation_regex = [
  '尚?未|还没|不再|没有|(?<![吞淹沉湮埋出覆罚])没(?!错|收)',
  '(?:^|[，,；;：:、])\s*(?:也|并|既|且|却|都|又)?不',
]

negation_allow = [
  "未来",
  "不过",
  "不同",
  "不断",
  "不仅",
  "不但",
  "不止",
  "不错",
]

# 仅检查回复末尾收尾句（保留问号等标点，忽略代码块与引用块），单次命中即回滚重写。
tail_regex = [
  '(?:需要我|要不要我?|要我顺手|要我顺便|要不要顺手|要不要顺便|需不需要我)[^\n]*[吗？?]',
  '(?:如需我|如果你需要[，,]?我可以|有需要随时告诉我|随时告诉我|需要的话告诉我)',
  '(?:如果你?同意|同意的话|若你同意)[，,]?我(?:把它|将其|现在|就|顺手|再)?(?:删|回滚|撤回|移除|清理|还原)',
  '(?:这两项|这几项|剩下的?[\u4e00-\u9fa50-9]+项|余下的?[\u4e00-\u9fa50-9]+项)[^\n]*(?:直接做完|一起做完|一并做完|现在做|继续处理)[^\n]*还是',
  '(?:需要我现在|要不要现在|你希望我现在)[^\n]*还是[^\n]*[？?]',
]
