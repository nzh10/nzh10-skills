# plain-check
# Seed rules adapted from IndenScale/slop-lint rulesets/zh.toml (MIT).
# slop-lint's density rules are flattened to plain blacklist entries here.

enabled = true
max_retries = 3
regex_min_sentences = 2

keywords = [
  "不代表",
  "不能把",
  "不能直接",
  "仍未补齐",
  "不能冒充",
  "而不是",
  "不表示",
  "尚未确认",
  "尚未落地",
  "尚未执行",
  "，不再",
  "，尚未",
  "，没有",
  "，不把",
  "，未作",
  "，避免",
  "，不等于",
  "，不保证",
  "不单独列为",
  "不足以说明",
  "不足以证明",
  "不能断言",
  "不能说明",
  "不能视为",
  "不完全",
  "只能说明",
  "不证明",
  "不能确定",
  "无法说明",
  "不能断定",
  "不能仅靠",
  "不能当作",
  "不能承诺",
  "无法证明",
  "并不是",
  "不构成",
  "不能据此",
  "夹具",
  "探针",
  "门禁",
  "，也不能",
]

# 每条 regex 单独计数：pattern 在几个句子里出现，就是 ×几。
# 句内不限字符数；同一个句子里出现多次也只算 1。
regex = [
  '不是[\s\S]*?(而?是|也不)',
  '不把[\s\S]*?说成',
  '是[\s\S]*?不是',
  '，(不[^过但]|避免)',
  '(尚?未|还没|不再)',
  '(仍|另)(需|缺|未|待|是|显示)',
  '实测',
]

# 仅检查回复末尾收尾句（保留问号等标点，忽略代码块与引用块），单次命中即回滚重写。
tail_regex = [
  '(?:需要我|要不要我?|要我顺手|要我顺便|要不要顺手|要不要顺便|需不需要我)[^\n]*[吗？?]',
  '(?:如需我|如果你需要[，,]?我可以|有需要随时告诉我|随时告诉我|需要的话告诉我)',
  '(?:如果你?同意|同意的话|若你同意)[，,]?我(?:把它|将其|现在|就|顺手|再)?(?:删|回滚|撤回|移除|清理|还原)',
  '(?:这两项|这几项|剩下的?[\u4e00-\u9fa50-9]+项|余下的?[\u4e00-\u9fa50-9]+项)[^\n]*(?:直接做完|一起做完|一并做完|现在做|继续处理)[^\n]*还是',
  '(?:需要我现在|要不要现在|你希望我现在)[^\n]*还是[^\n]*[？?]',
]
