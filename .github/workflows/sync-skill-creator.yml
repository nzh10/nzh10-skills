name: sync skill-creator

"on":
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-skill-creator
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync from anthropics/skills
        run: ./scripts/sync-skill-creator.sh
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "skill-creator already matches upstream"
            exit 0
          fi
          sha=$(sed -n 's/.*"sha": "\([0-9a-f]*\)".*/\1/p' upstream.json)
          git commit -m "sync skill-creator from anthropics/skills@${sha}"
          git push
