name: check-repo

"on":
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run deterministic repository checks
        run: ./scripts/check-repo.sh
      - name: Run unit tests
        run: node --test tests/guardrails.test.ts
